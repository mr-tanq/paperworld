permissions:
  contents: read

concurrency:
  group: paperworld-agent-chat-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  private-chat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PAPERWORLD (no persistent token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Copilot SDK package (NO AI requests)
        run: npm install --omit=dev --no-audit --no-fund --ignore-scripts
      - name: Verify Copilot SDK exports without authenticating
        run: node -e "if (typeof require('@github/copilot-sdk').CopilotClient !== 'function') process.exit(1)"
      - name: Syntax check village renderer and Messenger
        run: |
          node --check js/app.js
          node --check js/world-dialogue.js
          node --check js/messenger-format.js
          node --check js/workspace.js
          node --check js/camera-framing.js
          node --check js/connection-status.js
          node --check js/team-panel.js
          node --check js/human-first-hub.js
          node --check js/town-hall-briefing.js
          node --check js/cloud-ui.js
          node --check js/visual-agent-workflow.js
          node --check tests/integration/supabase-two-auth-memory.mjs
