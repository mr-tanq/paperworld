      - 'server/matt-approval-claimer.cjs'
      - 'render.yaml'
      - 'package.json'
      - 'server/matt-session-config.cjs'
      - 'server/matt-live-chat.cjs'
      - 'server/matt-delegation.cjs'
      - 'server/matt-semantic-router.cjs'
      - 'server/matt-worker-delegation.cjs'
      - 'server/agent-job-memory.cjs'
      - 'server/director-memory-policy.cjs'
      - 'server/director-memory-store.cjs'
      - 'server/director-memory-context.cjs'
      - 'server/approved-director-memory.cjs'
      - 'supabase/director_memory_review_v2_REVIEW_ONLY.sql'
      - 'supabase/paperworld_director_memory_v1_REVIEW.sql'
      - 'server/agent-job-history-api.cjs'
      - 'supabase/paperworld_agent_job_history_review.sql'
      - 'server/listening-repo-reader.cjs'
      - 'server/pokemon-worker-handoff.cjs'
      - 'server/pokemon-worker-delegation.cjs'
      - 'server/pokemon-repo-reader.cjs'
      - 'server/autofix-candidate-policy.cjs'
      - 'server/autofix-draft-workflow.cjs'
      - 'server/autofix-github-draft-publisher.cjs'
      - 'server/autofix-sandbox-plan.cjs'
      - 'server/autofix-sandbox-runner.cjs'
      - 'server/autofix-attestation-verifier.cjs'
      - 'server/autofix-pinned-source.cjs'
      - 'server/autofix-readiness.cjs'
      - 'server/github-oauth.cjs'
      - 'server/copilot-client-loader.cjs'
      - 'server/render-matt.cjs'
      - 'server/matt-http-server.cjs'
      - 'server/matt-gateway.cjs'
      - 'server/matt-copilot-adapter.cjs'
      - 'js/cloud.js'
      - 'js/cloud-ui.js'
      - 'js/director-memory-review.js'
      - 'js/messenger-format.js'
      - 'js/workspace.js'
      - 'js/camera-framing.js'
      - 'js/connection-status.js'
      - 'js/team-panel.js'
      - 'js/human-first-hub.js'
      - 'workspace.css'
      - 'messenger.css'
      - 'server/crow-reference-dossier.cjs'
      - 'server/director-direct-chat.cjs'
      - 'server/crow-songwriting-guide.cjs'
      - 'js/visual-agent-workflow.js'
      - 'js/agent-conversation-store.js'
      - 'index.html'
      - 'style.css'
      - 'js/app.js'
      - 'js/world-dialogue.js'
      - 'js/human-first-hub.js'
      - 'js/town-hall-briefing.js'
      - 'js/team-panel.js'
      - 'js/agents.js'
      - 'sql/paperworld_v5_dispatch_v1.sql'
      - 'sql/paperworld_v5_dispatch_v1_live_alignment.sql'
      - 'tests/**'
      - '.github/workflows/private-agent-chat-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperworld-agent-chat-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  private-chat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PAPERWORLD (no persistent token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Copilot SDK package (NO AI requests)
        run: npm install --omit=dev --no-audit --no-fund --ignore-scripts
      - name: Verify Copilot SDK exports without authenticating
        run: node -e "if (typeof require('@github/copilot-sdk').CopilotClient !== 'function') process.exit(1)"
      - name: Syntax check village renderer and Messenger
        run: |
          node --check js/app.js
          node --check js/world-dialogue.js
          node --check js/messenger-format.js
          node --check js/workspace.js
          node --check js/camera-framing.js
          node --check js/connection-status.js
          node --check js/team-panel.js
          node --check js/human-first-hub.js
          node --check js/town-hall-briefing.js
          node --check js/cloud-ui.js
          node --check js/visual-agent-workflow.js
          node --check tests/integration/supabase-two-auth-memory.mjs
      - name: Test agent registry, conversation, cloud storage and UI
        run: |
          node --test \
            tests/agent-profiles-ui.test.cjs \
            tests/human-first-integrated-v4.test.cjs \
            tests/listening-review.test.cjs \
            tests/portrait-art-v2.test.cjs \
            tests/agents.test.cjs \
            tests/agent-job-memory.test.cjs \
            tests/director-memory-policy.test.cjs \
            tests/director-memory-store.test.cjs \
            tests/director-memory-review.test.cjs \
            tests/director-memory-owner-review.test.cjs \
            tests/approved-director-memory.test.cjs \
            tests/agent-job-history-api.test.cjs \
            tests/agent-conversation-store.test.cjs \
            tests/agent-cloud-integration.test.cjs \
            tests/world-dialogue.test.cjs \
            tests/messenger-v2.test.cjs \
            tests/workspace-v2.test.cjs \
            tests/camera-framing.test.cjs \
            tests/connection-status.test.cjs \
            tests/director-memory-retrieval.test.cjs \
            tests/visual-agent-workflow.test.cjs \
            tests/village-first.test.cjs \
            tests/matt-visual.test.cjs \
            tests/matt-walk-v2.test.cjs \
            tests/matt-walk-v3.test.cjs \
            tests/human-player-visual.test.cjs \
            tests/listening-director-visual.test.cjs \
            tests/characters-hq.test.cjs \
            tests/pokemon-director-visual.test.cjs \
            tests/wellbeing-director-visual.test.cjs \
            tests/studio-director-visual.test.cjs \
            tests/director-display-names.test.cjs \
            tests/director-movement.test.cjs \
            tests/face-to-face-staging.test.cjs \
            tests/village-life-v2.test.cjs \
            tests/village-boot-script-tags.test.cjs \
            tests/paths-depth-v2.test.cjs \
            tests/matt-copilot-adapter.test.cjs \
            tests/matt-gateway.test.cjs \
            tests/supabase-identity-guard.test.cjs \
            tests/matt-http-server.test.cjs \
            tests/render-matt.test.cjs \
            tests/copilot-client-loader.test.cjs \
            tests/github-oauth.test.cjs \
            tests/matt-live-chat.test.cjs \
            tests/matt-delegation.test.cjs \
            tests/matt-semantic-router.test.cjs \
            tests/listening-repo-reader.test.cjs \
            tests/pokemon-worker-handoff.test.cjs \
            tests/pokemon-worker-delegation.test.cjs \
            tests/autofix-candidate-policy.test.cjs \
            tests/autofix-draft-workflow.test.cjs \
            tests/autofix-github-draft-publisher.test.cjs \
            tests/autofix-sandbox-plan.test.cjs \
            tests/autofix-sandbox-runner.test.cjs \
            tests/autofix-attestation-verifier.test.cjs \
            tests/autofix-pinned-source.test.cjs \
            tests/autofix-readiness.test.cjs \
            tests/matt-worker-delegation.test.cjs \
            tests/matt-session-config.test.cjs \
            tests/matt-approval-claimer.test.cjs
      - name: Run complete offline Node regression suite (no network/model calls)
        run: npm test

  director-memory-postgres-rls:
    name: Memory owner RLS (isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout review-only SQL (no saved auth token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client if not on runner
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Run owner RLS and audit integration in synthetic database
        env:
          PGPASSWORD: synthetic-only
        run: |
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d memory_test \
            -f tests/sql/director-memory-review-rls.sql
      - name: Execute V5 Dispatch lifecycle, budget and crash integration on PostgreSQL 17
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres dispatch_v1_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d dispatch_v1_synthetic \
            -f tests/sql/paperworld-v5-dispatch-integration.sql

# This PostgreSQL test uses a throwaway CI service, not connected PAPERWORLD
# Supabase, with synthetic identities only, no private data or AI credits.

# No Copilot permissions, no AI dispatch, no deployment, no secrets or write token.
# Live SDK behavior must be validated only after separate account-owner permission.
