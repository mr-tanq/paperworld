      - name: Run complete offline Node regression suite (no network/model calls)
        run: npm test

  director-memory-postgres-rls:
    name: Memory owner RLS (isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout review-only SQL (no saved auth token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client if not on runner
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Run owner RLS and audit integration in synthetic database
        env:
          PGPASSWORD: synthetic-only
        run: |
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d memory_test \
            -f tests/sql/director-memory-review-rls.sql
      - name: Routine Loop release migration — DST, exactly-once, RLS, isolation (PostgreSQL 17)
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres routine_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d routine_synthetic \
            -f tests/sql/paperworld-routine-loop-integration.sql
      - name: Autonomous fixes — limits, auto-merge switch and Matt's report (PostgreSQL 17)
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres autonomous_fixes_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d autonomous_fixes_synthetic \
            -f tests/sql/paperworld-autonomous-fixes-integration.sql
      - name: Phase 5 — routines start real work, safe fallback, exactly once (PostgreSQL 17)
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres phase5_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d phase5_synthetic \
            -f tests/sql/paperworld-phase5-routines-integration.sql
      - name: Phase 4 — Suno 50 songs per month cap (PostgreSQL 17)
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres suno_cap_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d suno_cap_synthetic \
            -f tests/sql/paperworld-suno-monthly-cap.sql
      - name: Owner-removed work items — RLS between owners (PostgreSQL 17)
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres dismissed_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d dismissed_synthetic \
            -f tests/sql/paperworld-dismissed-items.sql
      - name: Execute phone notification schema on PostgreSQL 17
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres push_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d push_synthetic \
            -f tests/sql/paperworld-push-notifications.sql
      - name: Execute Suno link schema on PostgreSQL 17
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres suno_links_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d suno_links_synthetic \
            -f tests/sql/paperworld-suno-links.sql
      - name: Execute memory lesson clean-up trigger on PostgreSQL 17
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres lesson_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d lesson_synthetic \
            -f tests/sql/paperworld-memory-lesson-clean.sql
      - name: Execute GitHub link schema on PostgreSQL 17
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres github_links_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d github_links_synthetic \
            -f tests/sql/paperworld-github-links.sql
      - name: Execute initiatives A+B schema on PostgreSQL 17
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres initiatives_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d initiatives_synthetic \
            -f tests/sql/paperworld-initiatives-ab.sql
      - name: Execute V5 Dispatch lifecycle, budget and crash integration on PostgreSQL 17
        env:
          PGPASSWORD: synthetic-only
        run: |
          createdb -h 127.0.0.1 -p 5432 -U postgres dispatch_v1_synthetic
          psql --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 5432 -U postgres -d dispatch_v1_synthetic \
            -f tests/sql/paperworld-v5-dispatch-integration.sql

# This PostgreSQL test uses a throwaway CI service, not connected PAPERWORLD
# Supabase, with synthetic identities only, no private data or AI credits.

# No Copilot permissions, no AI dispatch, no deployment, no secrets or write token.
# Live SDK behavior must be validated only after separate account-owner permission.
