name: PAPERWORLD private-agent chat — offline tests
on:
  pull_request:
    paths:
      - 'server/supabase-identity-guard.cjs'
      - 'server/matt-approval-claimer.cjs'
      - 'render.yaml'
      - 'package.json'
      - 'server/matt-live-chat.cjs'
      - 'server/github-oauth.cjs'
      - 'server/render-matt.cjs'
      - 'server/matt-http-server.cjs'
      - 'server/matt-gateway.cjs'
      - 'server/matt-copilot-adapter.cjs'
      - 'js/cloud.js'
      - 'js/agent-conversation-store.js'
      - 'index.html'
      - 'style.css'
      - 'js/app.js'
      - 'js/world-dialogue.js'
      - 'js/agents.js'
      - 'tests/**'
      - '.github/workflows/private-agent-chat-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperworld-agent-chat-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  private-chat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PAPERWORLD (no persistent token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Copilot SDK package (NO AI requests)
        run: npm install --omit=dev --no-audit --no-fund --ignore-scripts
      - name: Verify Copilot SDK exports without authenticating
        run: node -e "if (typeof require('@github/copilot-sdk').CopilotClient !== 'function') process.exit(1)"
      - name: Test agent registry, conversation, cloud storage and UI
        run: |
          node --test \
            tests/agents.test.cjs \
            tests/agent-conversation-store.test.cjs \
            tests/agent-cloud-integration.test.cjs \
            tests/world-dialogue.test.cjs \
            tests/village-first.test.cjs \
            tests/matt-copilot-adapter.test.cjs \
            tests/matt-gateway.test.cjs \
            tests/supabase-identity-guard.test.cjs \
            tests/matt-http-server.test.cjs \
            tests/render-matt.test.cjs \
            tests/github-oauth.test.cjs \
            tests/matt-live-chat.test.cjs \
            tests/matt-approval-claimer.test.cjs

# No Copilot permissions, no AI dispatch, no deployment, no secrets or write token.
# Live SDK behavior must be validated only after separate account-owner permission.
